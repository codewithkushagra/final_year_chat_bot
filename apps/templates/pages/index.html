{% extends 'layouts/base.html' %} {% load static %} {% block content %}

<!-- [ Main Content ] start -->
<div class="col">
  <div class="row">
    <!-- PIE CHART -->
    <div class="col-xl-6">
      <div class="card">
        <div class="card-header">
          <h5>Most Requested Queries</h5>
        </div>
        <div>
          <canvas id="myDoughnutChart"/>
        </div>
      </div>
    </div>
    <!-- PIE CHART - END -->

    <div class="card">
      <div class="card-header">
        <h5>Metrics</h5>
      </div>
      <div class="col mx-3">
        <!--INFO 1-->
        <div class="card-block m-3">
          <div class="row d-flex align-items-center">
            <div class="col-auto mb-4">
              <i class="feather icon-user f-30 text-c-green"></i>
            </div>
            <div class="col">
              <h3 class="f-w-300">235</h3>
              <span class="d-block text-uppercase m-b-40">TOTAL USERS</span>
            </div>
          </div>
        </div>


        <!--INFO 2-->
        <div class="card-block m-3">
          <div class="row d-flex align-items-center">
            <div class="col-auto mb-4">
              <i class="feather icon-zap f-30 text-c-blue"></i>
            </div>
            <div class="col">
              <h3 class="f-w-300">235</h3>
              <span class="d-block text-uppercase m-b-40">TOTAL QUERIES</span>
            </div>
          </div>
        </div>

        <!--INFO 3-->
        <div class="card-block m-3">
          <div class="row d-flex align-items-center">
            <div class="col-auto mb-4">
              <i class="feather icon-activity f-30 text-c-yellow"></i>
            </div>
            <div class="col">
              <h3 class="f-w-300">235</h3>
              <span class="d-block text-uppercase m-b-40">TOTAL QUERIES TODAY</span>
            </div>
          </div>
        </div>

      </div>
    </div>
  <div>
  
  <div class="row" style="margin-left:15px;">

    <!-- GRAPH -->
    <div class="card" style="width:528px">
      <div class="card-header">
        <h5>Weekly Stats</h5>
      </div>
      <canvas ="myLineChart" width="600" height="400"></canvas>
    </div>

    <!-- [ rating list ] starts-->
    <div class="ml-3">
      <div class="card user-list">
        <div class="card-header">
          <h5>Rating</h5>
        </div>
        <div class="card-block">
          <div class="row align-items-center justify-content-center m-b-20">
            <div class="col-6">
              <h2 class="f-w-300 d-flex align-items-center float-left m-0">
                4.7 <i class="fas fa-star f-10 m-l-10 text-c-yellow"></i>
              </h2>
            </div>
            <div class="col-6">
              <h6 class="d-flex align-items-center float-right m-0">
                0.4 <i class="fas fa-caret-up text-c-green f-22 m-l-10"></i>
              </h6>
            </div>
          </div>
          <div class="row">
            <div class="col-xl-12">
              <h6 class="align-items-center float-left">
                <i class="fas fa-star f-10 m-r-10 text-c-yellow"></i>5
              </h6>
              <h6 class="align-items-center float-right">384</h6>
              <div class="progress m-t-30 m-b-20" style="height: 6px">
                <div
                  class="progress-bar progress-c-theme"
                  role="progressbar"
                  style="width: 70%"
                  aria-valuenow="70"
                  aria-valuemin="0"
                  aria-valuemax="100"
                ></div>
              </div>
            </div>
            <div class="col-xl-12">
              <h6 class="align-items-center float-left">
                <i class="fas fa-star f-10 m-r-10 text-c-yellow"></i>4
              </h6>
              <h6 class="align-items-center float-right">145</h6>
              <div class="progress m-t-30 m-b-20" style="height: 6px">
                <div
                  class="progress-bar progress-c-theme"
                  role="progressbar"
                  style="width: 35%"
                  aria-valuenow="35"
                  aria-valuemin="0"
                  aria-valuemax="100"
                ></div>
              </div>
            </div>
            <div class="col-xl-12">
              <h6 class="align-items-center float-left">
                <i class="fas fa-star f-10 m-r-10 text-c-yellow"></i>3
              </h6>
              <h6 class="align-items-center float-right">24</h6>
              <div class="progress m-t-30 m-b-20" style="height: 6px">
                <div
                  class="progress-bar progress-c-theme"
                  role="progressbar"
                  style="width: 25%"
                  aria-valuenow="25"
                  aria-valuemin="0"
                  aria-valuemax="100"
                ></div>
              </div>
            </div>
            <div class="col-xl-12">
              <h6 class="align-items-center float-left">
                <i class="fas fa-star f-10 m-r-10 text-c-yellow"></i>2
              </h6>
              <h6 class="align-items-center float-right">1</h6>
              <div class="progress m-t-30 m-b-20" style="height: 6px">
                <div
                  class="progress-bar progress-c-theme"
                  role="progressbar"
                  style="width: 10%"
                  aria-valuenow="10"
                  aria-valuemin="0"
                  aria-valuemax="100"
                ></div>
              </div>
            </div>
            <div class="col-xl-12">
              <h6 class="align-items-center float-left">
                <i class="fas fa-star f-10 m-r-10 text-c-yellow"></i>1
              </h6>
              <h6 class="align-items-center float-right">0</h6>
              <div class="progress m-t-30 m-b-20" style="height: 6px">
                <div
                  class="progress-bar"
                  role="progressbar"
                  style="width: 0"
                  aria-valuenow="0"
                  aria-valuemin="0"
                  aria-valuemax="100"
                ></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- [ rating list ] end-->
  </div>
</div>


  <div>
    {% endblock content %} {% block extra_js %}
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
    <script>
      // Data setup For Pie chart
      const dataP = {
        labels: ["Red", "Blue", "Yellow"],
        datasets: [
          {
            label: "My First Dataset",
            data: [300, 50, 100],
            backgroundColor: [
              "rgb(255, 99, 132)",
              "rgb(54, 162, 235)",
              "rgb(255, 205, 86)",
            ],
            hoverOffset: 4,
          },
        ],
      };
  
      // Configuration - PIE
      const configP = {
        type: "doughnut",
        data: dataP,
      };
  
      // Initialize the Pie Chart
      const ctxP = document.getElementById("myDoughnutChart").getContext("2d");
      new Chart(ctxP, configP);
    </script>
  
    <script>
      const labelsL = [
        "January",
        "February",
        "March",
        "April",
        "May",
        "June",
        "July",
      ];
      const dataL = {
        labels: labelsL,
        datasets: [
          {
            label: "My First Dataset",
            data: [65, 59, 80, 81, 56, 55, 40],
            fill: false,
            borderColor: "rgb(75, 192, 192)",
            tension: 0.1,
          },
        ],
      };
  
      // Configuration - LINE
      const configL = {
        type: "line",
        data: dataL,
      };
  
      // Initialize the Line Chart
      const ctxL = document.getElementById("myLineChart").getContext("2d");
      new Chart(ctxL, configL);
    </script>
  
    {% endblock extra_js %}
  </div>
